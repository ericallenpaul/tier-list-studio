appId: com.tierliststudio.app
productName: Tier List Studio
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
win:
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
