name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: corepack pnpm run package:win
            artifact: windows-installer
            files: release/*.exe
          - name: linux-x64
            os: ubuntu-latest
            command: corepack pnpm run package:linux
            artifact: linux-installer
            files: release/*.AppImage
          - name: macos-x64
            os: macos-13
            command: corepack pnpm run package:mac:x64
            artifact: macos-x64-installer
            files: release/*.dmg
          - name: macos-arm64
            os: macos-14
            command: corepack pnpm run package:mac:arm64
            artifact: macos-arm64-installer
            files: release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "Tier List Studio ${GITHUB_REF_NAME}" \
            --generate-notes
